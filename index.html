<style>
:root{
  --bg:#F5F7FA;--sf:#fff;--sf2:#F0F3F8;--sf3:#E3EAF4;
  --bd:rgba(16,60,104,0.12);--bd2:rgba(16,60,104,0.22);
  --tx:#0D2137;--tx2:#4A5E72;--tx3:#8FA0B4;
  --navy:#103C68;--navy2:#0A2A4A;--orange:#F99D1C;
  --hot:#D94F2B;--hotbg:rgba(217,79,43,0.08);
  --warm:#E08A10;--warmbg:rgba(224,138,16,0.1);
  --cool:#0284C7;--coolbg:rgba(2,132,199,0.08);

  --r:10px;--rs:6px;
  --fn:'DM Sans',sans-serif;--mo:'DM Mono',monospace
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--sf2)}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
.app{display:flex;height:100vh;overflow:hidden}
.sbar{width:230px;min-width:230px;background:var(--navy);display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;background:var(--bg)}
.sbar-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,0.12);text-align:center}
.sbar-logo img{max-width:140px;height:40px;object-fit:contain;background:#fff;border-radius:6px;padding:5px 10px}
.logo-fy{font-size:10px;color:rgba(255,255,255,0.4);font-family:var(--mo);margin-top:6px}
.sbar-nav{padding:10px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);cursor:pointer;font-size:13px;color:rgba(255,255,255,0.65);transition:all .15s;user-select:none;border-left:3px solid transparent}
.ni:hover{background:rgba(255,255,255,0.08);color:#fff}
.ni.active{background:rgba(255,255,255,0.15);color:#fff;font-weight:600;border-left-color:var(--orange)}
.nb{margin-left:auto;background:var(--hot);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.nb.w{background:var(--orange)}
.sbar-bot{padding:10px;border-top:1px solid rgba(255,255,255,0.12)}
.sr{font-size:11px;color:rgba(255,255,255,0.4);font-family:var(--mo);display:flex;align-items:center;gap:6px;padding:6px 12px;margin-bottom:4px}
.sd{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0}
.sd.err{background:#f87171;animation:none}.sd.loading{background:#fbbf24}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}.sd{animation:blink 2s infinite}
.tb{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--bd);background:var(--sf);position:sticky;top:0;z-index:10;gap:12px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(16,60,104,0.06)}
.tb-t{font-size:18px;font-weight:600;letter-spacing:-.4px;color:var(--navy)}.tb-a{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);font-family:var(--fn);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.bp{background:var(--navy);color:#fff}.bp:hover{background:var(--navy2)}
.bg{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd2)}.bg:hover{background:var(--sf3);color:var(--tx)}
.bd2c{background:var(--hotbg);color:var(--hot);border:1px solid rgba(217,79,43,0.2)}
.bs{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.cnt{padding:24px;max-width:1100px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 3px rgba(16,60,104,0.05)}
.ml{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mo);margin-bottom:8px}
.mv{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1}.ms{font-size:11px;color:var(--tx3);margin-top:4px}
.ch{color:var(--hot)}.cw{color:var(--warm)}.cg{color:var(--grn)}.ca{color:var(--navy)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.st{font-size:11px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mo)}
.ll{display:flex;flex-direction:column;gap:8px}
.lc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(16,60,104,0.04)}
.lc:hover{border-color:var(--navy);box-shadow:0 3px 10px rgba(16,60,104,0.1);transform:translateY(-1px)}
.lc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:10px 0 0 10px}
.lc.hot::before{background:var(--hot)}.lc.warm::before{background:var(--orange)}.lc.cool::before{background:var(--cool)}.lc.closed::before{background:var(--tx3)}
.lt{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.lco{font-weight:600;font-size:14px;color:var(--navy)}.lct{font-size:12px;color:var(--tx2);margin-top:1px}
.bdg{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;font-family:var(--mo)}
.bh{background:var(--hotbg);color:var(--hot)}.bwm{background:var(--warmbg);color:var(--warm)}.bc{background:var(--coolbg);color:var(--cool)}.bn{background:var(--sf2);color:var(--tx3)}.ba{background:rgba(16,60,104,0.08);color:var(--navy)}
.ln{font-size:12px;color:var(--tx2);line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lm{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--tx3);font-family:var(--mo);flex-wrap:wrap}
.la{margin-left:auto;font-size:11px;color:var(--navy);font-weight:500;font-family:var(--mo)}
.si{flex:1;min-width:180px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:8px 12px;color:var(--tx);font-family:var(--fn);font-size:13px;outline:none;transition:border .15s}
.si:focus{border-color:var(--navy)}.si::placeholder{color:var(--tx3)}
select.fsel{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:8px 12px;color:var(--tx2);font-family:var(--fn);font-size:13px;outline:none;cursor:pointer}
.bl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx3);cursor:pointer;transition:color .15s}.bl:hover{color:var(--navy)}
.dh{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.df label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mo);display:block;margin-bottom:3px}
.df span{font-size:13px;color:var(--tx)}
.np{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.nt{font-size:11px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mo);margin-bottom:12px}
.ne{border-left:2px solid var(--bd2);padding:4px 0 4px 14px;margin-bottom:8px;position:relative}
.ne::before{content:'';position:absolute;left:-5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--sf3);border:2px solid var(--bd2)}
.nx{font-size:13px;color:var(--tx2);line-height:1.5}
.nr{display:flex;gap:8px;margin-top:12px}
.nta{flex:1;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:8px 12px;color:var(--tx);font-family:var(--fn);font-size:13px;resize:none;outline:none;min-height:60px;transition:border .15s}
.nta:focus{border-color:var(--navy)}
.aip{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.aih{padding:12px 16px;background:rgba(16,60,104,0.05);border-bottom:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--navy)}
.aib{padding:14px 16px;font-size:13px;line-height:1.7;color:var(--tx2);min-height:60px}
.aib.loading{display:flex;align-items:center;gap:10px;color:var(--tx3);font-style:italic}
.aia{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ff{display:flex;flex-direction:column;gap:5px}.ff.full{grid-column:1/-1}
.fl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mo)}
.fi{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 12px;color:var(--tx);font-family:var(--fn);font-size:13px;outline:none;transition:border .15s;width:100%}
.fi:focus{border-color:var(--navy)}.fi::placeholder{color:var(--tx3)}
textarea.fi{resize:vertical;min-height:60px}select.fi{cursor:pointer}
.fc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.fa{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--bd2);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
.spl{width:28px;height:28px;border-width:3px}
.emp{text-align:center;padding:40px 20px;color:var(--tx3);font-size:13px}
.tc{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:10px 16px;font-size:13px;color:var(--tx);min-width:220px;animation:tsl .2s ease;box-shadow:0 4px 12px rgba(16,60,104,0.1)}
.tst.ok{border-color:rgba(22,163,74,.3);color:var(--grn)}.tst.err{border-color:rgba(217,79,43,.3);color:var(--hot)}
@keyframes tsl{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.cmo{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:14px;font-size:13px;line-height:1.7;color:var(--tx2);min-height:100px;white-space:pre-wrap}
.scw{display:flex;align-items:center;gap:8px}.scb{flex:1;height:4px;background:var(--sf3);border-radius:4px;overflow:hidden}.scf{height:100%;border-radius:4px}
.pgl{font-size:11px;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mo);margin:16px 0 8px;font-weight:600}
.ss{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px}
.ss-t{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:16px;border-bottom:1px solid var(--bd);padding-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.fr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.fr:last-of-type{border-bottom:none}.fn2{font-size:13px;font-weight:500;flex:1;min-width:80px}
.ftb{font-size:11px;color:var(--tx3);font-family:var(--mo);background:var(--sf2);padding:2px 8px;border-radius:10px}
.fr.drag-over{border-top:2px solid var(--orange)}
.tw{display:flex;flex-wrap:wrap;gap:6px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:6px 10px;min-height:40px;align-items:center;cursor:text;transition:border .15s}
.tw:focus-within{border-color:var(--navy)}
.tg{background:rgba(16,60,104,0.08);color:var(--navy);font-size:12px;padding:2px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;font-family:var(--mo)}
.tx2c{cursor:pointer;opacity:.6;font-size:15px}.tx2c:hover{opacity:1}
.ti{background:transparent;border:none;outline:none;font-family:var(--fn);font-size:13px;color:var(--tx);min-width:80px;flex:1}
.ti::placeholder{color:var(--tx3)}
.dz{border:2px dashed var(--bd2);border-radius:var(--r);padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--sf)}
.dz:hover,.dz.over{border-color:var(--navy);background:rgba(16,60,104,0.03)}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt th{text-align:left;padding:8px 10px;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mo);border-bottom:1px solid var(--bd);font-weight:500}
.mt td{padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.mt tr:last-child td{border-bottom:none}
.cp{font-size:11px;color:var(--tx3);font-family:var(--mo);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw{background:var(--sf3);border-radius:4px;height:8px;overflow:hidden;margin-top:8px}
.pf{height:100%;background:var(--navy);border-radius:4px;transition:width .3s}
.io{background:var(--grnbg);border:1px solid rgba(22,163,74,.25);border-radius:var(--r);padding:16px;font-size:13px;color:var(--grn)}
.ie{background:var(--hotbg);border:1px solid rgba(217,79,43,.2);border-radius:var(--r);padding:14px;font-size:13px;color:var(--hot);margin-top:8px}
.setup{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:32px;max-width:500px;width:92%;box-shadow:0 8px 32px rgba(16,60,104,0.1)}
.stps{background:var(--sf2);border-radius:var(--r);padding:16px;margin-bottom:16px}
.stp{display:flex;gap:10px;font-size:12px;color:var(--tx2);margin-bottom:8px;line-height:1.5}.stp:last-child{margin-bottom:0}
.stn{background:var(--navy);color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;margin-top:1px}
.modal-bg{position:fixed;inset:0;background:rgba(16,60,104,.3);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:24px;width:92%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(16,60,104,.2)}
.modal-t{font-size:16px;font-weight:600;color:var(--navy);margin-bottom:20px}
@media(max-width:640px){.sbar{display:none}.fg{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}.mg{grid-template-columns:1fr 1fr}}
</style>

<script>
const SHEET_ID='1G5W5ciuj4vvTje3imj6ib2jIa4avTmdsDEpPQewzdGo';
const LS='Leads',FS='Fields',CS='Config';
const KS='adsvita_creds',US='adsvita_user',LS2='adsvita_logo';
const AP='adsvita2025';
const DEFAULT_LOGO='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTUwIiBoZWlnaHQ9IjQwIiB2aWV3Qm94PSIwIDAgMTUwIDQwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxwb2x5Z29uIHBvaW50cz0iMTgsMzYgNiwzNiAxMiwxMiIgZmlsbD0iI0Y5OUQxQyIvPjxwb2x5Z29uIHBvaW50cz0iMTgsMzYgMzAsMzYgMjQsMTIiIGZpbGw9IiMxMDNDNjgiLz48dGV4dCB4PSIzNiIgeT0iMjciIGZvbnQtZmFtaWx5PSJHZW9yZ2lhLHNlcmlmIiBmb250LXNpemU9IjIwIiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMTAzQzY4Ij5BZHN2aXRhPC90ZXh0Pjx0ZXh0IHg9IjM2IiB5PSIzNyIgZm9udC1mYW1pbHk9IkFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iOCIgZmlsbD0iI0Y5OUQxQyIgbGV0dGVyLXNwYWNpbmc9IjIiIGZvbnQtd2VpZ2h0PSI2MDAiPkNPTU1VTklRVUU8L3RleHQ+PC9zdmc+';

const DEFAULT_FIELDS=[
  {key:'company',label:'Company Name',type:'text',required:true,locked:true,order:0},
  {key:'contact',label:'Client Name',type:'text',order:1},
  {key:'designation',label:'Designation',type:'text',order:2},
  {key:'mobile',label:'Mobile No.',type:'text',order:3},
  {key:'email',label:'Email',type:'text',order:4},
  {key:'earlierAgency',label:'Earlier Agency',type:'text',order:5},
  {key:'category',label:'Category',type:'dropdown',options:['AR','SR','IPO','InvIT','BRSR','ESG','Other'],order:6},
  {key:'responsibility',label:'Responsibility',type:'dropdown',options:['DS','AS','CK','Chintan','Riddhi'],order:7},

  {key:'enquirySource',label:'Enquiry Source',type:'dropdown',options:['Cold Call','Website Inquiry','Referral','LinkedIn','WhatsApp','Other'],order:9},

  {key:'status2526',label:'Current Year Status',type:'textarea',order:11},

];

let S={
  view:'dashboard',leads:[],fields:[],cfg:{},
  loading:true,sel:null,prev:'dashboard',
  creds:null,token:null,tokenExp:0,user:null,
  q:'',fs:'',cache:{},admin:false,
  imp:{step:0,rows:[],hdrs:[],map:{},prev:{},errs:[],done:0,fname:''}
};

// ── JWT AUTH ──────────────────────────────────────────────────────────────────
function b64u(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
function s2u(s){return new TextEncoder().encode(s);}
async function getToken(){
  if(S.token&&Date.now()<S.tokenExp-30000)return S.token;
  if(!S.creds)throw new Error('No credentials');
  const c=S.creds,now=Math.floor(Date.now()/1000);
  const hdr=b64u(s2u(JSON.stringify({alg:'RS256',typ:'JWT'})));
  const clm=b64u(s2u(JSON.stringify({iss:c.client_email,scope:'https://www.googleapis.com/auth/spreadsheets',aud:c.token_uri,iat:now,exp:now+3600})));
  const si=hdr+'.'+clm;
  const pem=c.private_key.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g,'');
  const der=Uint8Array.from(atob(pem),x=>x.charCodeAt(0));
  const key=await crypto.subtle.importKey('pkcs8',der,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',key,s2u(si));
  const jwt=si+'.'+b64u(sig);
  const r=await fetch(c.token_uri,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion='+jwt});
  if(!r.ok){const e=await r.json();throw new Error(e.error_description||'Token error');}
  const d=await r.json();S.token=d.access_token;S.tokenExp=Date.now()+d.expires_in*1000;return S.token;
}

// ── SHEETS API ────────────────────────────────────────────────────────────────
const BASE='https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID;
async function sGet(sh){
  const t=await getToken();
  const r=await fetch(BASE+'/values/'+encodeURIComponent(sh)+'!A1:ZZ3000',{headers:{Authorization:'Bearer '+t}});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Read error');}
  const d=await r.json();const rows=d.values||[];
  return{headers:rows[0]||[],rows:rows.slice(1)};
}
async function sPut(sh,rng,vals){
  const t=await getToken();
  const r=await fetch(BASE+'/values/'+encodeURIComponent(sh)+'!'+rng+'?valueInputOption=RAW',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({values:vals})});

// ── REMINDERS ─────────────────────────────────────────────────────────────────
function parseDate(val){
  if(!val)return null;var s=String(val).trim();if(!s)return null;
  var d=new Date(s);if(!isNaN(d)&&d.getFullYear()>2000)return d;
  var p=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(p){d=new Date(parseInt(p[3]),parseInt(p[2])-1,parseInt(p[1]));if(!isNaN(d))return d;}
  return null;
}
function daysDiff(date){var now=new Date();now.setHours(0,0,0,0);var d=new Date(date);d.setHours(0,0,0,0);return Math.round((d-now)/864e5);}
function getRem(lead){
  var val=lead.nextConnect||lead.nextAction||'';var d=parseDate(val);if(!d)return null;
  var diff=daysDiff(d);
  if(diff<0)return{type:'overdue',days:Math.abs(diff),label:Math.abs(diff)+'d overdue',color:'#D94F2B'};
  if(diff===0)return{type:'today',days:0,label:'Today',color:'#E08A10'};
  if(diff<=7)return{type:'soon',days:diff,label:'In '+diff+'d',color:diff<=3?'#E08A10':'#0284C7'};
  return null;
}
function getOverdue(){return S.leads.filter(function(l){if(['closed','lost'].includes(l.stage))return false;var r=getRem(l);return r&&r.type==='overdue';}).sort(function(a,b){var ra=getRem(a),rb=getRem(b);return(rb?rb.days:0)-(ra?ra.days:0);});}
function getToday(){return S.leads.filter(function(l){if(['closed','lost'].includes(l.stage))return false;var r=getRem(l);return r&&r.type==='today';});}
function getUpcoming(){return S.leads.filter(function(l){if(['closed','lost'].includes(l.stage))return false;var r=getRem(l);return r&&r.type==='soon';}).sort(function(a,b){var ra=getRem(a),rb=getRem(b);return(ra?ra.days:999)-(rb?rb.days:999);});}

async function doSnooze(id){
  var lead=S.leads.find(function(l){return l.id===id;});if(!lead)return;
  var v=document.getElementById('snz-d').value;if(!v)return;
  var d=new Date(v);var fmt=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  var updated=Object.assign({},lead,{nextConnect:fmt,updatedAt:new Date().toISOString()});
  var ok=await saveLead(updated,false);if(ok){S.sel=updated;closeM();toast('Date updated \u2713','ok');nav('reminders');}
}

// ── FORM RENDERER ─────────────────────────────────────────────────────────────
function rF(field,value,pfx){
  var id=pfx+'-'+field.key;var v=String(value||'');
  var full=field.type==='textarea'?' full':'';
  if(field.type==='dropdown'&&field.options&&field.options.length){
    var opts=field.options.map(function(o){return '<option value="'+esc(o)+'"'+(v===o?' selected':'')+'>'+esc(o)+'</option>';}).join('');
    return '<div class="ff'+full+'"><label class="fl">'+esc(field.label)+(field.required?' *':'')+'</label><select class="fi" id="'+id+'"><option value="">&mdash;</option>'+opts+'</select></div>';
  }else if(field.type==='textarea'){
    return '<div class="ff full"><label class="fl">'+esc(field.label)+'</label><textarea class="fi" id="'+id+'">'+esc(v)+'</textarea></div>';
  }else if(field.type==='date'){
    return '<div class="ff'+full+'"><label class="fl">'+esc(field.label)+'</label><input class="fi" type="date" id="'+id+'" value="'+esc(v)+'"/></div>';
  }else if(field.type==='number'){
    return '<div class="ff'+full+'"><label class="fl">'+esc(field.label)+'</label><input class="fi" type="number" id="'+id+'" value="'+esc(v)+'"/></div>';
  }
  return '<div class="ff'+full+'"><label class="fl">'+esc(field.label)+(field.required?' *':'')+'</label><input class="fi" id="'+id+'" value="'+esc(v)+'" placeholder="'+esc(field.label)+'"/></div>';
}

function importHTML(){

      '<div style="padding:24px"><div class="fc" style="margin-bottom:16px">'+
      '<div style="font-size:13px;color:var(--tx2);line-height:1.8;margin-bottom:16px">&#x2460; Upload Excel &rarr; &#x2461; Map columns &rarr; &#x2462; Import to Google Sheets</div>'+

      '<div class="dz" id="dz" onclick="document.getElementById(\'fi\').click()">'+

      '</div>'+
      '<input type="file" id="fi" accept=".xlsx,.xls" style="display:none" onchange="onFile(event)"/>'+
      '</div></div>';
  }
  if(imp.step===1){
    var impF=S.fields.length>0?S.fields:DEFAULT_FIELDS;
    if(Object.keys(imp.map).length===0){
      impF.forEach(function(f){
        var h=imp.hdrs.find(function(h){return h.trim().toLowerCase()===f.label.toLowerCase();})||
              imp.hdrs.find(function(h){return h.trim().replace(/[\s\-_.]/g,'').toLowerCase()===f.label.replace(/[\s\-_.]/g,'').toLowerCase();})||'';
        if(h)imp.map[f.key]=h;
      });
    }
    var coO='<option value="">&mdash; Skip &mdash;</option>'+imp.hdrs.map(function(h){return '<option value="'+esc(h)+'">'+esc(h)+'</option>';}).join('');
    var rows=impF.map(function(f){
      var cur=imp.map[f.key]||'';
      return '<tr><td style="font-weight:500">'+esc(f.label)+(f.required?'<span style="color:var(--hot)"> *</span>':'')+'</td>'+
        '<td><select class="fi" style="margin:0;padding:6px 8px;font-size:12px" onchange="S.imp.map[\''+f.key+'\']=this.value;upP(\''+f.key+'\',this.value)">'+coO.replace('value="'+esc(cur)+'"','value="'+esc(cur)+'" selected')+'</select></td>'+
        '<td class="cp" id="pv-'+f.key+'">'+(cur?esc(imp.prev[cur]||''):'&mdash;')+'</td></tr>';
    }).join('');
    return '<div class="tb"><span class="bl" onclick="resetImp()">&larr; Back</span><div class="tb-t" style="margin-left:12px">Map Columns</div></div>'+
      '<div style="padding:24px"><div class="fc" style="margin-bottom:16px">'+
      '<div style="font-size:13px;color:var(--tx2);margin-bottom:12px">File: <strong>'+esc(imp.fname)+'</strong> &middot; <strong>'+imp.rows.length+' rows</strong> &middot; <strong>'+imp.hdrs.length+' columns</strong></div>'+
      '<div style="overflow-x:auto"><table class="mt"><thead><tr><th>App Field</th><th>Excel Column</th><th>Preview</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px"><button class="btn bp" onclick="startImp()">Import '+imp.rows.length+' Leads &rarr;</button><button class="btn bg" onclick="resetImp()">Cancel</button></div></div>';
  }
  if(imp.step===2){
    var pct=imp.rows.length?Math.round((imp.done/imp.rows.length)*100):0;
    return '<div class="tb"><div class="tb-t">Importing...</div></div><div style="padding:24px"><div class="fc">'+
      '<div style="font-size:15px;font-weight:600;color:var(--navy);margin-bottom:12px">Importing to Google Sheets</div>'+
      '<div style="font-size:13px;color:var(--tx2);margin-bottom:8px" id="itxt">'+imp.done+' of '+imp.rows.length+'</div>'+
      '<div class="pw"><div class="pf" id="ibar" style="width:'+pct+'%"></div></div>'+
      '</div></div>';
  }
  var errH=imp.errs.length?'<div class="ie"><strong>'+imp.errs.length+' rows skipped</strong> (no company name): rows '+imp.errs.slice(0,8).join(', ')+(imp.errs.length>8?'...':'')+'</div>':'';
  return '<div class="tb"><div class="tb-t">Import Complete</div></div><div style="padding:24px">'+

    '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn bp" onclick="finImp()">View All Leads</button><button class="btn bg" onclick="resetImp()">Import Another</button></div>'+

function bindDZ(){
  var dz=document.getElementById('dz');if(!dz)return;
  dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',function(){dz.classList.remove('over');});
  dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('over');var f=e.dataTransfer.files[0];if(f)readF(f);});
}
function onFile(e){var f=e.target.files[0];if(f)readF(f);}
function readF(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'binary'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
      if(json.length<2){toast('File is empty','err');return;}
      var hdrs=json[0].map(function(h){return String(h||'').trim();});
      var dataRows=json.slice(1).filter(function(r){return r.some(function(c){return String(c||'').trim();});});
      var prev={};hdrs.forEach(function(h,i){prev[h]=String(dataRows[0]&&dataRows[0][i]||'').slice(0,50);});
      var rows=dataRows.map(function(r){var o={};hdrs.forEach(function(h,i){o[h]=String(r[i]||'').trim();});return o;});
      S.imp={step:1,rows:rows,hdrs:hdrs,map:{},prev:prev,errs:[],done:0,fname:file.name};render();
    }catch(err){toast('Could not read: '+err.message,'err');}
  };
  reader.readAsBinaryString(file);
}
function upP(fk,col){var el=document.getElementById('pv-'+fk);if(el)el.textContent=col?(S.imp.prev[col]||'&mdash;'):'&mdash;';}
async function startImp(){
  var cf=getCF();
  var impF=S.fields.length>0?S.fields:DEFAULT_FIELDS;
  // Read current select values
  impF.forEach(function(f){var sel=document.querySelector('select[onchange*="\''+f.key+'\'"]');if(sel&&sel.value)S.imp.map[f.key]=sel.value;});
  if(!S.imp.map[cf?cf.key:'company']){
    var h=S.imp.hdrs.find(function(h){return /company/i.test(h);})||S.imp.hdrs[0];
    if(h)S.imp.map[cf?cf.key:'company']=h;else{toast('Map Company Name column first','err');return;}
  }
  var imp=S.imp;imp.step=2;imp.done=0;imp.errs=[];
  render();
  var sm={hot:'hot',warm:'warm',upcoming:'upcoming',closed:'closed',lost:'lost',missed:'warm',active:'warm','on hold':'upcoming',new:'warm'};
  var keys=['id'].concat(impF.map(function(f){return f.key;})).concat(['createdAt','updatedAt']);
  var nl=[];var sf=getSF();
  for(var i=0;i<imp.rows.length;i++){
    var row=imp.rows[i];
    var co=(row[imp.map[cf?cf.key:'company']]||'').trim();
    if(!co){imp.errs.push(i+2);continue;}
    var lead={id:uid(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    impF.forEach(function(f){var c=imp.map[f.key];lead[f.key]=c?row[c]||'':'';});
    lead[cf?cf.key:'company']=co;
    var rs=String(lead[sf?sf.key:'stage']||lead.followupStatus||'').toLowerCase().trim();
    if(sf)lead[sf.key]=sm[rs]||'warm';
    nl.push(lead);S.leads.push(lead);
  }
  if(!nl.length){toast('No valid rows','err');imp.step=1;render();return;}
  try{
    for(var i=0;i<nl.length;i+=20){
      var chunk=nl.slice(i,i+20);
      await sApp(LS,chunk.map(function(l){return keys.map(function(k){return String(l[k]||'');});}));
      imp.done=Math.min(i+20,nl.length);
      var bar=document.getElementById('ibar'),txt=document.getElementById('itxt');
      if(bar)bar.style.width=Math.round((imp.done/nl.length)*100)+'%';
      if(txt)txt.textContent=imp.done+' of '+nl.length;
      await new Promise(function(r){setTimeout(r,150);});
    }
    imp.step=3;render();toast('Import complete!','ok');
  }catch(e){toast('Import error: '+e.message,'err');imp.step=1;render();}
}
function resetImp(){S.imp={step:0,rows:[],hdrs:[],map:{},prev:{},errs:[],done:0,fname:''};render();}
function finImp(){resetImp();nav('leads');}

  if(btn){btn.disabled=true;btn.textContent='Generating...';}
  var cf=getCF();var nf=getNF();
  var company=lead[cf?cf.key:'company']||'the company';
  var contact=lead.contact||'the contact';
  var context=lead[nf?nf.key:'lastNote']||lead.status2526||lead.lastNote||'first contact';
  var category=lead.category||'Annual Report / Sustainability Report';
  var tl={
    followup:'a follow-up call script with 5 numbered steps',
    whatsapp:'a WhatsApp message (under 60 words, conversational)',
    email:'a professional email with subject line and full body',
    proposal:'a proposal introduction email (formal, under 100 words)',
    reminder:'a gentle reminder message (20-30 words)',
    cold:'a cold outreach introduction email (under 80 words)'
  }[type]||'a follow-up message';
    var prompt=[
    'Write '+tl+' for Adsvita Communique, a corporate annual report and sustainability report design firm in India. The sender is Chintan.',
    '',
    'Company: '+company,
    'Contact: '+contact+(lead.designation?' ('+lead.designation+')':''),
    'Category: '+category,
    'Last interaction: '+context,
    '',
    'Instructions:',
    '- Write the actual ready-to-send message',
    '- No placeholder text like [name] or [date]',
    '- Reference the actual company and context',
    '- Professional but warm tone',
    '- End with: Chintan | Adsvita Communique'
  ].join('\n');
  try{
    var txt=await callAI(prompt);
    if(!txt||txt.trim()===''){throw new Error('Empty response from AI');}
    out.style.color='var(--tx)';out.textContent=txt;
  }catch(e){
    out.style.color='var(--hot)';
    out.textContent='Error generating message: '+e.message+'

Please check your internet connection and try again.';
  }
  if(btn){btn.disabled=false;btn.textContent='✦ Generate';}
}
function doCopy(){var t=document.getElementById('cout').textContent;if(t)navigator.clipboard.writeText(t).then(function(){toast('Copied \u2713','ok');});}
function exportExcel(){
  if(!S.leads.length){toast('No leads to export','err');return;}
  try{
    var headers=S.fields.map(function(f){return f.label;});
    var rows=S.leads.map(function(lead){return S.fields.map(function(f){return lead[f.key]||'';});});
    var ws=XLSX.utils.aoa_to_sheet([headers].concat(rows));
    ws['!cols']=headers.map(function(h,i){var w=Math.max(h.length,Math.max.apply(null,rows.map(function(r){return String(r[i]||'').length;})));return{wch:Math.min(Math.max(w,10),50)};});
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Leads');
    XLSX.writeFile(wb,'Adsvita_Leads_'+getFY()+'.xlsx');toast('Downloaded \u2713','ok');
  }catch(e){toast('Export error: '+e.message,'err');}
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function doConn(){
  var raw=document.getElementById('sk').value.trim();
  if(!raw){toast('Paste your JSON credentials','err');return;}
  try{
    var creds=JSON.parse(raw);
    if(creds.type!=='service_account')throw new Error('Not a service account JSON');
    S.creds=creds;localStorage.setItem(KS,btoa(raw));S.loading=true;render();loadAll();
  }catch(e){toast('Invalid JSON: '+e.message,'err');}
}
function changeCreds(){localStorage.removeItem(KS);localStorage.removeItem(US);S.creds=null;S.token=null;S.user=null;S.leads=[];S.fields=[];render();}
function doLogin(){
  var email=document.getElementById('lg-e').value.trim().toLowerCase();
  var pass=document.getElementById('lg-p').value;
  var err=document.getElementById('lg-err');
  if(!email||!pass){if(err){err.style.display='';err.textContent='Enter email and password.';}return;}
  try{
    var users=JSON.parse(S.cfg['users']||'[]');
    var user=users.find(function(u){return u.email.toLowerCase()===email&&u.password===pass;});
    if(!user){if(err){err.style.display='';err.textContent='Incorrect email or password.';}return;}
    S.user=user;localStorage.setItem(US,JSON.stringify(user));S.loading=true;render();loadAll();
  }catch(e){if(err){err.style.display='';err.textContent='Error: '+e.message;}}
}
function doLogout(){S.user=null;localStorage.removeItem(US);S.leads=[];S.fields=[];S.cache={};render();}
function unlockA(){var p=document.getElementById('ap').value;if(p===AP){S.admin=true;render();}else toast('Wrong password','err');}
function getV(pfx){
  var v={};
  S.fields.forEach(function(f){var el=document.getElementById(pfx+'-'+f.key);if(el)v[f.key]=el.value||'';});
  return v;
}
async function doAdd(){
  var cf=getCF();var v=getV('f');
  if(!v[cf?cf.key:'company']||!v[cf?cf.key:'company'].trim()){toast((cf?cf.label:'Company')+' required','err');return;}
  var lead=Object.assign({id:uid(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},v);
  var btn=document.querySelector('.fa .btn.bp');if(btn){btn.disabled=true;btn.textContent='Saving...';}
  var ok=await saveLead(lead,true);
  if(ok)nav('leads');else if(btn){btn.disabled=false;btn.textContent='Save to Sheets';}
}
async function doEdit(id){
  var lead=S.leads.find(function(l){return l.id===id;});if(!lead)return;
  var cf=getCF();var v=getV('e');
  if(!v[cf?cf.key:'company']||!v[cf?cf.key:'company'].trim()){toast((cf?cf.label:'Company')+' required','err');return;}
  var updated=Object.assign({},lead,v,{updatedAt:new Date().toISOString()});
  var btn=document.querySelector('.fa .btn.bp');if(btn){btn.disabled=true;btn.textContent='Updating...';}
  var ok=await saveLead(updated,false);
  if(ok){S.sel=updated;nav('detail',updated);}else if(btn){btn.disabled=false;btn.textContent='Update';}
}
async function addNote(id){
  var note=document.getElementById('ni').value.trim();if(!note){toast('Type a note','err');return;}
  var lead=S.leads.find(function(l){return l.id===id;});if(!lead)return;
  var nf=getNF();if(!nf)return;
  var newNote='('+today()+') '+note;
  var upd=Object.assign({},lead,{updatedAt:new Date().toISOString()});
  upd[nf.key]=(lead[nf.key]?lead[nf.key]+'\n':'')+newNote;
  var ok=await saveLead(upd,false);if(ok){S.sel=upd;nav('detail',upd);}
}
async function setSt(id,stage){
  var lead=S.leads.find(function(l){return l.id===id;});if(!lead)return;
  var sf=getSF();if(!sf)return;
  var upd=Object.assign({},lead,{updatedAt:new Date().toISOString()});upd[sf.key]=stage;upd.stage=stage;
  var ok=await saveLead(upd,false);if(ok){S.sel=upd;nav('detail',upd);}
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  try{var _s=localStorage.getItem(KS);if(_s)S.creds=JSON.parse(atob(_s));}catch(e){localStorage.removeItem(KS);}
  try{var _u=localStorage.getItem(US);if(_u)S.user=JSON.parse(_u);}catch(e){}
  render();
  if(S.creds&&S.user){S.loading=true;render();loadAll();}
  else if(S.creds&&!S.user){render();}
}
// Run when DOM is ready
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
